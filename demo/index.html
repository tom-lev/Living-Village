<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>כפר חי</title>
<meta name="description" content="מפה וקטורית מצוירת של כפר קטן עם דמויות חיות. אפשר להתקרב בלי לאבד חדות.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #7fb84d;
  --ink: #3b2f25;
  --ink-soft: #6b5a4a;
  --card: rgba(255, 252, 244, .94);
  --line: rgba(59, 47, 37, .14);
  --accent: #e2574c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #4d7a33; --card: rgba(40, 36, 30, .92); --ink: #f6eee2; --ink-soft: #cdbfae; --line: rgba(255, 255, 255, .14); }
}
:root[data-theme="dark"] { --bg: #4d7a33; --card: rgba(40, 36, 30, .92); --ink: #f6eee2; --ink-soft: #cdbfae; --line: rgba(255, 255, 255, .14); }

html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
/* שתי שכבות: סטטית (קרקע, דרכים, בתים, עצים) ודינמית (דמויות ואפקטים, מתעדכנת בכל פריים).
   בזמן זום/גרירה שתיהן רק מוזזות ומוגדלות ב-GPU (transform של CSS). הדמויות ממשיכות לזוז:
   בשכבה הדינמית מצוירים מחדש רק האזורים הקטנים שבהם משהו זז. כשהאצבע עוזבת, הכול מצויר מחדש וחד. */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#stage.drag { cursor: grabbing; }
#sWrap, #dWrap { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#mapS, #mapD { position: absolute; display: block; }
svg { shape-rendering: geometricPrecision; }
svg text { font-family: "Rubik", system-ui, sans-serif; pointer-events: none; }
.who, .veh { cursor: pointer; }

@media (pointer: coarse) { #zin, #zout { display: none; } .controls button { min-width: 40px; height: 40px; font-size: 17px; } }

/* כפתורים */
.controls { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); inset-inline-end: 16px; display: flex; flex-direction: column; gap: 8px; }
button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  min-width: 44px; height: 44px; font-size: 20px; line-height: 1; cursor: pointer; box-shadow: 0 3px 12px rgba(30, 50, 10, .16);
  display: grid; place-items: center; padding: 0 10px; }
button:hover { filter: brightness(1.04); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.zoom { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); inset-inline-start: 16px; font-size: 13px; color: var(--ink-soft);
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.follow { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  display: none; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 6px 6px 14px; font-size: 14px; box-shadow: 0 3px 12px rgba(30, 50, 10, .16); white-space: nowrap; }
.follow.on { display: flex; }
.follow button { height: 30px; min-width: 30px; font-size: 14px; border-radius: 999px; box-shadow: none; }

#stage.paused * { animation-play-state: paused !important; }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="מפה מצוירת של כפר">
  <div id="sWrap"><svg id="mapS"></svg></div>
  <div id="dWrap"><svg id="mapD"></svg></div>
</div>

<div class="controls">
  <button id="zin" aria-label="התקרבות">+</button>
  <button id="zout" aria-label="התרחקות">−</button>
  <button id="zfit" aria-label="חזרה לתצוגה המלאה">⤢</button>
  <button id="play" aria-label="עצירה">❚❚</button>
</div>
<div class="zoom" id="zoomLbl">×1.0</div>
<div class="follow" id="follow"><span id="followName"></span><button id="unfollow" aria-label="הפסקת מעקב">✕</button></div>

<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';

/* ───────── שכבות ───────── */
const defs = el('defs', null, svgD);
const worldS = el('g', null, svgS), worldD = el('g', null, svgD);
const L = {};
for (const n of ['ground', 'roads', 'groundProps', 'water', 'props']) L[n] = el('g', { 'data-layer': n }, worldS);
for (const n of ['waterFx', 'cloudShadows', 'pad', 'fx', 'actors', 'air', 'clouds']) L[n] = el('g', { 'data-layer': n }, worldD);
/* אפקטים קטנים (עשן, להבה, מזרקה, אדוות...) מונפשים מ-JS ולא ב-CSS:
   אנימציית CSS על SVG מצוירת כתמונה בגודל שהיה כשהתחילה, ובזום היא מתפקסלת. כאן כל פריים מצויר מחדש כווקטור. */
const FX = [];
const at = (cx, cy, sx, sy) => `translate(${n2(cx)},${n2(cy)}) scale(${sx.toFixed(3)},${sy.toFixed(3)}) translate(${n2(-cx)},${n2(-cy)})`;
function smokeFx(e, cx, cy, delay, dur = 4.8, dx = 16, dy = -52) {
  FX.push(t => {
    const p = wrap1((t + delay) / dur), s = .35 + 1.25 * p;
    e.setAttribute('transform', `translate(${n2(dx * p)},${n2(dy * p)}) ` + at(cx, cy, s, s));
    e.setAttribute('opacity', (p < .12 ? p / .12 * .8 : .8 * (1 - (p - .12) / .88)).toFixed(2));
  });
}

/* ───────── רשת הדרכים: צמתים וקטעים (כל קטע הוא עקומת בזייה אחת) ───────── */
/* שלוש עמודות (שמאל, אמצע, ימין) וארבע שורות, ולולאה סביב האגם למעלה */
const NODES = {
  TL: [90, 70], N1: [70, 470], N2: [400, 455], N3: [735, 465], W: [330, 250], E: [740, 235],
  N4: [70, 830], N5: [400, 835], N6: [730, 825], N7: [75, 1180], N8: [400, 1185], N9: [725, 1175],
  BX: [410, 1694], LX: [6, 1330], RX: [794, 865],
};
const BORDER = new Set();   // המפה ממשיכה מעבר לכפר: ביציאות ההולכים מסתובבים וחוזרים   // דרכים שיוצאות מהמפה: הולכים יוצאים ונכנסים שם
const EDGE_DEF = [
  ['TL', 'N1', 60, 200, 80, 330], ['N1', 'N2', 180, 470, 290, 450], ['N2', 'N3', 510, 460, 620, 470],
  ['N2', 'W', 330, 420, 320, 330], ['W', 'E', 320, 30, 740, 10], ['E', 'N3', 750, 330, 750, 400],
  ['N1', 'N4', 80, 590, 60, 710], ['N2', 'N5', 410, 590, 390, 710], ['N3', 'N6', 720, 590, 740, 710],
  ['N4', 'N5', 180, 845, 290, 830], ['N5', 'N6', 510, 840, 620, 820], ['N4', 'N7', 60, 950, 85, 1060],
  ['N6', 'N9', 740, 950, 715, 1060], ['N7', 'N8', 180, 1190, 290, 1175], ['N8', 'N9', 510, 1190, 620, 1170],
  ['N8', 'BX', 410, 1350, 380, 1530], ['N7', 'LX', 60, 1250, 30, 1300], ['N6', 'RX', 760, 830, 780, 850],
];
/* טבלת אורך-קשת לכל קטע, כדי להתקדם לפי מרחק אמיתי (ולא לפי t של העקומה) */
function bez(p0, c1x, c1y, c2x, c2y, p3) {
  const N = 200, pts = [], acc = [0];
  for (let i = 0; i <= N; i++) {
    const t = i / N, u = 1 - t;
    pts.push([u * u * u * p0[0] + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * p3[0],
              u * u * u * p0[1] + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * p3[1]]);
    if (i) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  }
  return { pts, acc, len: acc[N], d: `M${P(p0)}C${c1x},${c1y} ${c2x},${c2y} ${P(p3)}` };
}
/* דרכים מחוץ לכפר: רק ציור (אין עליהן הולכים) */
const OUTER_ROADS = [
  [[90, 70], 100, -100, 250, -250, [300, -380]], [[300, -380], 320, -480, 380, -560, [420, -610]],
  [[6, 1330], -100, 1345, -200, 1300, [-300, 1300]], [[-300, 1300], -330, 1000, -300, 700, [-280, 430]],
  [[794, 865], 950, 885, 1150, 860, [1300, 880]], [[410, 1694], 400, 1850, 430, 2050, [410, 2235]],
  [[405, 1955], 250, 1965, 0, 1995, [-230, 1985]],
  [[-280, 430], -450, 380, -700, 300, [-850, 235]], [[1300, 880], 1450, 900, 1650, 985, [1790, 985]],
  [[-230, 1985], -450, 1990, -700, 2040, [-860, 2050]], [[420, -610], 450, -750, 560, -900, [610, -1030]],
].map(([a, c1x, c1y, c2x, c2y, b]) => bez(a, c1x, c1y, c2x, c2y, b));
/* שבילים להולכי רגל: צרים ומתפתלים, מחברים בין המקומות שמחוץ לכפר (ציור בלבד) */
const TRAILS = [
  [[560, -1060], [420, -1010], [250, -1040], [80, -1150], [-150, -1250], [-400, -1395]],
  [[-700, -1080], [-600, -1200], [-450, -1330]], [[-700, -1080], [-760, -900], [-800, -700], [-800, -520]],
  [[-780, -470], [-600, -380], [-450, -250], [-300, -175]], [[-230, -160], [0, -120], [200, -200], [300, -330]],
  [[300, -330], [500, -250], [650, -215], [800, -260], [950, -200], [1000, -60], [900, 40], [740, 10]],
  [[950, -200], [1050, -290], [1150, -290], [1250, -250], [1450, -100], [1600, 60]],
  [[1650, 250], [1550, 420], [1500, 620], [1600, 800], [1780, 930]],
  [[1800, 1010], [1830, 1150], [1790, 1320], [1810, 1500], [1860, 1750], [1850, 2000], [1700, 2150], [1500, 2235]],
  [[1050, 1000], [1040, 1300], [1025, 1600], [1050, 1900], [980, 2180]],
  [[960, 700], [1040, 630], [1150, 620], [1200, 600]],
  [[-950, 260], [-1000, 500], [-1050, 760], [-900, 980], [-760, 1120], [-700, 1380], [-900, 1520], [-1000, 1700], [-1000, 1950]],
  [[-620, 700], [-760, 520], [-900, 300]], [[-430, 1330], [-600, 1250], [-740, 1170]],
  [[-480, 1960], [-650, 2150], [-520, 2240]], [[-380, 2290], [-100, 2252], [200, 2248]],
  [[820, 1300], [950, 1450], [900, 1700], [800, 1860]], [[60, 600], [-120, 650], [-170, 800]],
  [[-1200, -900], [-1000, -800], [-820, -720]], [[-1200, -200], [-1000, -100], [-960, 60]],
  [[1300, -600], [1600, -700], [1900, -900], [2000, -1150]], [[1350, 300], [1500, 330], [1580, 200]],
  [[-1250, 1250], [-1100, 1150], [-900, 1000]], [[1950, 400], [1850, 600], [1900, 800]],
  [[130, -1160], [250, -1250], [380, -1240], [470, -1150], [400, -1080]],

  const p0 = NODES[a], p3 = NODES[b], N = 200, pts = [], acc = [0];
  for (let i = 0; i <= N; i++) {
    const t = i / N, u = 1 - t;
    pts.push([u * u * u * p0[0] + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * p3[0],

/* רשת תפוסה גסה (תא של 10 יחידות): איפה יש דרך, שביל או נהר. בדיקה מהירה לשתילת עצים ודשא בעולם גדול */

/* אזורי מים (לא שותלים בהם ולא מציירים עליהם דשא) */
const WATERS = [];
const inWater = (x, y, m = 0) => WATERS.some(w => ((x - w.cx) / (w.rx + m)) ** 2 + ((y - w.cy) / (w.ry + m)) ** 2 < 1);
/* נהר: מההרים בצפון-מזרח עד הים בדרום */
const RIVER_PTS = [[1080, -1430], [1120, -1150], [1050, -880], [1110, -640], [1110, -420], [1070, -150], [1130, 250], [1080, 650], [1140, 1050], [1090, 1500], [1150, 1900], [1100, 2400]];
const RIVER_SAMPLES = [];

  for (let t = 0; t < 1; t += .05) RIVER_SAMPLES.push([RIVER_PTS[i][0] + (RIVER_PTS[i + 1][0] - RIVER_PTS[i][0]) * t, RIVER_PTS[i][1] + (RIVER_PTS[i + 1][1] - RIVER_PTS[i][1]) * t]);

  let m = 1e9;
  for (const p of RIVER_SAMPLES) { const d = (p[0] - x) ** 2 + (p[1] - y) ** 2; if (d < m) m = d; }
  return Math.sqrt(m);

  for (let i = 0; i < pts.length - 1; i++) {

  dynamics.sort((a, b) => a.y - b.y);

  for (const d of dynamics) {

  { name: 'נועה', h: 34, headR: .1, skin: SKIN[0], hair: '#6b3e26', hairStyle: 'long', shirt: '#e85d75', pants: '#3d5a80' },
  { name: 'איתי', h: 36, headR: .095, skin: SKIN[2], hair: '#2b2220', hairStyle: 'short', shirt: '#3aa0d8', pants: '#59463a', hold: 'leash' },
  { name: 'מאיה', h: 24, headR: .12, skin: SKIN[4], hair: '#b5651d', hairStyle: 'pony', shirt: '#ffcc33', pants: '#f1c7a5', skirt: '#ff7aa2', hold: 'balloon' },
  { name: 'סבתא רחל', h: 31, headR: .1, skin: SKIN[0], hair: '#e9e4dc', hairStyle: 'bun', shirt: '#8e6cc9', pants: '#f1c7a5', skirt: '#7656b3' },
  { name: 'דני', h: 35, headR: .095, skin: SKIN[1], hair: '#3b2a20', hairStyle: 'short', shirt: '#f28c28', pants: '#2f4858', hat: '#2e86de' },
  { name: 'ליה', h: 33, headR: .1, skin: SKIN[3], hair: '#1e1612', hairStyle: 'bun', shirt: '#fff7e6', pants: '#8d5a3b', skirt: '#2bb3a0' },
  { name: 'עומר', h: 33, headR: .1, skin: SKIN[1], hair: '#c0392b', hairStyle: 'short', shirt: '#6abf4b', pants: '#4a4a55' },
  { name: 'יעל', h: 32, headR: .1, skin: SKIN[2], hair: '#4a2c1a', hairStyle: 'pony', shirt: '#5b7bd5', pants: '#e9e4dc' },
  { name: 'אבי', h: 35, headR: .095, skin: SKIN[3], hair: '#1e1612', hairStyle: 'short', shirt: '#e2574c', pants: '#3b3b46' },
];
const SPEEDS = [26, 27, 21, 16, 28, 25, 30, 24, 26];
const walkers = LOOKS.map((l, i) => new Walker(l, SPEEDS[i]));
const dog = new Dog(walkers[1], '#c8894e');
const leash = new Leash(walkers[1], dog);
const balloon = new Balloon(walkers[2], '#e8413b');
// סבא על הספסל: מפזר פירורים ליונים מדי פעם
const grandpa = new Sitter({ name: 'סבא משה', h: 33, headR: .095, skin: SKIN[0], hair: '#d9d4cc', hairStyle: 'short', shirt: '#8a9a5b', pants: '#5a4a3a', hat: '#6b4a2f' },
  247, 1094, .3 * 33, 1, (t, h) => {
    const toss = Math.max(0, Math.sin(t * .9)) ** 6;
    return [[.2 * h + toss * .12 * h, -.33 * h - toss * .1 * h], [.17 * h, -.32 * h]];
  });
// תמר ליד המדורה: מחממת ידיים
const camper = new Sitter({ name: 'תמר', h: 32, headR: .1, skin: SKIN[1], hair: '#2b2220', hairStyle: 'long', shirt: '#2bb3a0', pants: '#3d5a80' },
  FIRE[0] + 36, FIRE[1] + 1, .26 * 32, -1, (t, h) => {
    const w = Math.sin(t * 2.2) * .02 * h;
    return [[.32 * h + w, -.42 * h], [.3 * h - w, -.4 * h]];
  });
// רכבים: מכונית אדומה ומיניבוס צהוב שנוסעים בלולאה בכיוונים הפוכים
const ROUTE = [[1, 1], [3, 1], [4, 1], [5, 1], [8, 1], [12, 1], [14, -1], [13, -1], [11, -1], [6, -1]];   // לולאה: האגם ואז היקף הכפר
const ROUTE_REV = ROUTE.slice().reverse().map(([e, d]) => [e, -d]);
new Vehicle({ name: 'המכונית האדומה', color: '#ef5b5b', len: 52, speed: 48, lane: 9, route: ROUTE });
new Vehicle({ name: 'המיניבוס', color: '#ffc53d', len: 60, speed: 38, lane: 9, route: ROUTE_REV, tall: true, s: 40 });

statics.sort((a, b) => a.y - b.y);
const PROP_BANDS = Array.from({ length: NB }, () => el('g', null, L.props));
for (const s of statics) { const bb = s.el.getBBox(); PROP_BANDS[tileOf(bb.x + bb.width / 2, s.y)].appendChild(s.el); }
sortDepth();

/* ═════════════════════ מצלמה: זום וגרירה ═════════════════════ */
const cam = { k: 1, x: 0, y: 0 };
let fitK = 1, minK = 1, vw = 0, vh = 0, anim = null, following = null;
const zoomLbl = document.getElementById('zoomLbl');
const ptrs = new Map();
let down = null, pinch = null;
let committed = { k: 1, x: 0, y: 0 }, dcam = { k: 1, x: 0, y: 0 }, M = 0;
let gesturing = false, gestureMoved = false, wheelTimer = 0;
function measure() {
  const r = stage.getBoundingClientRect(); vw = r.width; vh = r.height;
  // בטלפון לאורך המפה ממלאת את המסך (כיסוי, חיתוך קטן בקצוות); במסך רחב רואים את כולה
  const fit = (w, h) => { const c = Math.min(vw / w, vh / h), v = Math.max(vw / w, vh / h); return v / c < 1.2 ? v : c; };
  fitK = fit(W, H);                                              // תצוגת הבית: הכפר
  minK = Math.min(fitK, fit(B.x1 - B.x0, B.y1 - B.y0));          // הכי רחוק: כל העולם
  // השכבות גדולות מהמסך בשוליים M, כדי שבזמן גרירה/הקטנה לא ייחשפו חורים לפני הציור מחדש
  M = Math.round(Math.max(vw, vh) * .3);
  for (const sv of [svgS, svgD]) {
    sv.setAttribute('width', vw + 2 * M); sv.setAttribute('height', vh + 2 * M);
    sv.style.left = -M + 'px'; sv.style.top = -M + 'px';
  }
}
const camMatrix = c => `matrix(${c.k} 0 0 ${c.k} ${(c.x + M).toFixed(2)} ${(c.y + M).toFixed(2)})`;
/* ציור חד של השכבה הסטטית במצב המצלמה הנוכחי (יקר; קורה רק כשהמצלמה נחה) */
const bandShown = [];
function cullBands() {
  const y0 = (-M - cam.y) / cam.k, y1 = (vh + M - cam.y) / cam.k, x0 = (-M - cam.x) / cam.k, x1 = (vw + M - cam.x) / cam.k, far = cam.k < fitK * .45;
  for (let i = 0; i < NB; i++) {
    const top = B.y0 + Math.floor(i / NC) * BAND, bot = top + BAND, left = B.x0 + (i % NC) * COL, right = left + COL;
    // אובייקט בולט עד ~170 יחידות מעל הבסיס שלו ועד ~110 לצדדים
    const vis = bot > y0 - 20 && top - 170 < y1 && right + 110 > x0 && left - 110 < x1;
    const dv = vis && !far;                                  // דשא: מוסתר גם כשמתרחקים מאוד
    if (bandShown[i] !== vis) { PROP_BANDS[i].setAttribute('display', vis ? 'inline' : 'none'); bandShown[i] = vis; }
    if (bandShown[NB + i] !== dv) { DETAIL_BANDS[i].setAttribute('display', dv ? 'inline' : 'none'); bandShown[NB + i] = dv; }
  }
}
function commit() {
  committed = { k: cam.k, x: cam.x, y: cam.y };
  cullBands();
  worldS.setAttribute('transform', camMatrix(cam));
  sWrap.style.transform = '';
}
function commitD() {
  dcam = { k: cam.k, x: cam.x, y: cam.y };
  worldD.setAttribute('transform', camMatrix(cam));
  dWrap.style.transform = '';
  L.clouds.setAttribute('opacity', clamp((4 - cam.k / fitK) / 2.5, 0, 1).toFixed(2));   // בזום עמוק העננים מתפוגגים
}
/* מזיז שכבה שכבר צוירה (base) למצב המצלמה הנוכחי בעזרת CSS בלבד. false אם השוליים כבר לא מכסים את המסך */
function cssMove(wrap, base) {
  const s = cam.k / base.k, tx = cam.x - s * base.x, ty = cam.y - s * base.y;
  if (tx - s * M > 0 || ty - s * M > 0 || tx + s * (vw + M) < vw || ty + s * (vh + M) < vh) return false;
  wrap.style.transform = `matrix(${s.toFixed(5)},0,0,${s.toFixed(5)},${tx.toFixed(2)},${ty.toFixed(2)})`;
  return true;
}
function clampCam() {
  cam.k = clamp(cam.k, minK, fitK * 24);
  const bw = (B.x1 - B.x0) * cam.k, bh = (B.y1 - B.y0) * cam.k;
  cam.x = bw <= vw ? vw / 2 - (B.x0 + B.x1) / 2 * cam.k : clamp(cam.x, vw - B.x1 * cam.k, -B.x0 * cam.k);
  cam.y = bh <= vh ? vh / 2 - (B.y0 + B.y1) / 2 * cam.k : clamp(cam.y, vh - B.y1 * cam.k, -B.y0 * cam.k);
}
function applyCam() {
  clampCam();
  if (gesturing) {
    gestureMoved = true;
    if (!cssMove(sWrap, committed)) commit();
    if (!cssMove(dWrap, dcam)) commitD();
  } else {
    // מחוץ למחווה (למשל מעקב אחרי דמות): הדינמית מתעדכנת ממילא, הסטטית רק זזה
    commitD();
    if (Math.abs(cam.k - committed.k) > 1e-9 || !cssMove(sWrap, committed)) commit();
  }
  zoomLbl.textContent = '×' + (cam.k / fitK).toFixed(1);
}
function beginGesture() {
  if (gesturing) return;
  gesturing = true; gestureMoved = false;
}
function endGesture() {
  if (!gesturing || ptrs.size || anim || wheelTimer) return;
  gesturing = false;
  if (gestureMoved) { commit(); commitD(); }
}
function zoomAt(sx, sy, f) {
  const nk = clamp(cam.k * f, minK, fitK * 24), wx = (sx - cam.x) / cam.k, wy = (sy - cam.y) / cam.k;
  cam.k = nk; cam.x = sx - wx * nk; cam.y = sy - wy * nk; applyCam();
}
function animateTo(k, wx, wy, ms = 420) {        // wx,wy: נקודת עולם שתהיה במרכז המסך
  beginGesture();
  const s = { ...cam }, e = { k, x: vw / 2 - wx * k, y: vh / 2 - wy * k }, t0 = performance.now();
  anim = (now) => {
    const u = Math.min(1, (now - t0) / ms), q = u < .5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2;
    // אינטרפולציה לוגריתמית בזום כדי שהמעבר ירגיש אחיד
    cam.k = s.k * Math.pow(e.k / s.k, q);
    const cx = (vw / 2 - s.x) / s.k + ((vw / 2 - e.x) / e.k - (vw / 2 - s.x) / s.k) * q;
    const cy = (vh / 2 - s.y) / s.k + ((vh / 2 - e.y) / e.k - (vh / 2 - s.y) / s.k) * q;
    cam.x = vw / 2 - cx * cam.k; cam.y = vh / 2 - cy * cam.k; applyCam();
    if (u >= 1) { anim = null; endGesture(); }
  };
  if (!running) requestAnimationFrame(function step(n) { if (anim) { anim(n); requestAnimationFrame(step); } });
}
function center() { return [(vw / 2 - cam.x) / cam.k, (vh / 2 - cam.y) / cam.k]; }
function fitAll() { measure(); animateTo(fitK, W / 2, H / 2); }

stage.addEventListener('wheel', e => {
  e.preventDefault(); anim = null; beginGesture();
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? .012 : .0018)));
  clearTimeout(wheelTimer); wheelTimer = setTimeout(() => { wheelTimer = 0; endGesture(); }, 180);
}, { passive: false });

stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) { const f = e.target.closest('[data-f]'); down = { x: e.clientX, y: e.clientY, f: f ? +f.dataset.f : null, moved: false }; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), c: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] }; if (down) down.moved = true; }
  anim = null; stage.classList.add('drag'); beginGesture();
});
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const r = stage.getBoundingClientRect();
  if (ptrs.size === 1) {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down.moved = true; }
    if (down && down.moved) { cam.x += e.clientX - prev[0]; cam.y += e.clientY - prev[1]; if (following) stopFollow(); applyCam(); }
  } else if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    cam.x += c[0] - pinch.c[0]; cam.y += c[1] - pinch.c[1];
    zoomAt(c[0] - r.left, c[1] - r.top, d / pinch.d);
    pinch = { d, c };
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) {
    stage.classList.remove('drag');
    if (down && !down.moved && down.f !== null) startFollow(followables[down.f]);
    down = null;
    endGesture();
  }
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('dblclick', e => { const r = stage.getBoundingClientRect(); const wx = (e.clientX - r.left - cam.x) / cam.k, wy = (e.clientY - r.top - cam.y) / cam.k; animateTo(Math.min(cam.k * 2, fitK * 24), wx, wy); });

const followEl = document.getElementById('follow');
function startFollow(f) {
  following = f;
  document.getElementById('followName').textContent = 'עוקבים אחרי ' + f.name;
  followEl.classList.add('on');
  if (cam.k < fitK * 4) animateTo(fitK * 5, f.x, f.y - 15, 650);
}
function stopFollow() { following = null; followEl.classList.remove('on'); }
document.getElementById('unfollow').onclick = stopFollow;
document.getElementById('zin').onclick = () => { const c = center(); animateTo(Math.min(cam.k * 1.8, fitK * 24), c[0], c[1], 300); };
document.getElementById('zout').onclick = () => { const c = center(); animateTo(Math.max(cam.k / 1.8, minK), c[0], c[1], 300); };
document.getElementById('zfit').onclick = () => { stopFollow(); fitAll(); };
addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=') document.getElementById('zin').click();
  if (e.key === '-') document.getElementById('zout').click();
  if (e.key === '0') document.getElementById('zfit').click();
});
addEventListener('resize', () => { const c = center(), z = cam.k / fitK; measure(); cam.k = fitK * z; cam.x = vw / 2 - c[0] * cam.k; cam.y = vh / 2 - c[1] * cam.k; clampCam(); commit(); applyCam(); });

/* ═════════════════════ לולאת האנימציה ═════════════════════ */
let running = false, last = 0, T = 0, frame = 0;
const playBtn = document.getElementById('play');
function tick(now) {
  if (!running) return;
  const dt = Math.min(.05, (now - last) / 1000 || .016); last = now; T += dt; frame++;
  for (const f of FX) f(T, dt);
  for (const w of walkers) w.update(dt, T);
  dog.update(dt, T); leash.update(); balloon.update(dt, T);
  grandpa.update(dt, T); camper.update(dt, T);
  for (const d of dynamics) if (d instanceof Vehicle) d.update(dt);
  if (frame % 6 === 0) sortDepth();
  // סוסים: רועים ומרימים ראש מדי פעם
  for (const h of HORSES) {
    h.timer -= dt;
    if (h.timer <= 0) { h.graze = !h.graze; h.timer = h.graze ? rand(5, 11) : rand(2, 4); }
    h.ta = h.graze ? 75 : 0; h.a += (h.ta - h.a) * Math.min(1, dt * 2.2);
    h.neck.setAttribute('transform', `translate(18,${(-42 + h.a / 75 * 16).toFixed(1)}) rotate(${h.a.toFixed(1)})`);
  }
  for (const s of SHEEP) s.update(dt);
  if (frame % 8 === 0) { const ord = SHEEP.slice().sort((a, b) => a.y - b.y); for (const s of ord) L.pad.appendChild(s.g); }
  // ברווזים: האמא מובילה, הקטנים בעקבותיה
  DUCKS.forEach((d, i) => {
    const th = T * .07 - i * .085 - (i ? .05 : 0), p = duckPath(th), q = duckPath(th + .01), f = q[0] >= p[0] ? 1 : -1;
    d.flip += (f - d.flip) * Math.min(1, dt * 4);
    d.g.setAttribute('transform', `translate(${n2(p[0])},${n2(p[1] + Math.sin(T * 3 + i) * .6)}) scale(${d.flip.toFixed(3)},1)`);
    if (i === 0 && frame % 50 === 0) ripple(p[0] - f * 8, p[1], 9, 3);
  });
  // דג
  if (FISH.t < 0) {
    FISH.wait -= dt;
    if (FISH.wait <= 0) {
      const a = rand(0, 6.28), r = rand(.2, .6), x = LAKE.cx + Math.cos(a) * LAKE.rx * r, y = LAKE.cy + Math.sin(a) * LAKE.ry * r;
      Object.assign(FISH, { t: 0, x, y, dx: pick([-1, 1]) * rand(30, 44) }); fish.setAttribute('display', 'inline'); ripple(x, y, 9, 3.5);
    }
  } else {
    FISH.t += dt / 1.1;
    const u = Math.min(1, FISH.t), x = FISH.x + FISH.dx * u, y = FISH.y - 34 * 4 * u * (1 - u), vy = -34 * 4 * (1 - 2 * u);
    fish.setAttribute('transform', `translate(${n2(x)},${n2(y)}) scale(${FISH.dx > 0 ? 1 : -1},1) rotate(${(Math.atan2(vy, Math.abs(FISH.dx)) * 180 / Math.PI).toFixed(1)})`);
    if (u >= 1) { FISH.t = -1; FISH.wait = rand(5, 10); fish.setAttribute('display', 'none'); ripple(x, FISH.y, 10, 3.5); ripple(x, FISH.y, 5, 2); }
  }
  // פרפרים
  for (const b of BUTTERFLIES) {
    const s = b.s + T, x = b.cx + Math.sin(s * .37) * 60 + Math.sin(s * 1.3) * 14, y = b.cy + Math.sin(s * .53) * 45 + Math.cos(s * 1.7) * 8 - 10;
    const flap = Math.abs(Math.sin(s * 15)) * .8 + .2;
    b.g.setAttribute('transform', `translate(${n2(x)},${n2(y)})`);
    b.wl.setAttribute('transform', `translate(0,0) scale(${flap.toFixed(2)},1)`); b.wr.setAttribute('transform', `scale(${flap.toFixed(2)},1)`);
  }
  // עננים
  for (const c of CLOUDS) {
    c.x += c.v * dt; if (c.x > B.x1 + 160) c.x = B.x0 - 160;
    c.c.setAttribute('transform', `translate(${n2(c.x)},${n2(c.y)})`);
    c.sh.setAttribute('transform', `translate(${n2(c.x + 40)},${n2(c.y + 110)})`);
  }
  // להקת ציפורים
  if (FLOCK.x > B.x1 + 80 || FLOCK.g.getAttribute('display') === 'none') {
    FLOCK.wait -= dt;
    if (FLOCK.wait <= 0) { FLOCK.x = B.x0 - 60; FLOCK.y = rand(B.y0 + 300, B.y1 - 400); FLOCK.wait = rand(18, 30); FLOCK.g.setAttribute('display', 'inline'); }
    else if (FLOCK.x > B.x1 + 80) FLOCK.g.setAttribute('display', 'none');
  }
  if (FLOCK.g.getAttribute('display') !== 'none') {
    FLOCK.x += 60 * dt; FLOCK.y -= 6 * dt;
    for (const [p, [ox, oy], ph] of FLOCK.birds) {
      const f = Math.sin(T * 9 + ph) * 4, x = FLOCK.x + ox, y = FLOCK.y + oy + Math.sin(T * 1.5 + ph) * 2;
      p.setAttribute('d', `M${n2(x - 6)},${n2(y + f * .3)}Q${n2(x - 3)},${n2(y - f)} ${n2(x)},${n2(y)}Q${n2(x + 3)},${n2(y - f)} ${n2(x + 6)},${n2(y + f * .3)}`);
    }
  }
  // מצלמה: אנימציית זום, או מעקב חלק אחרי דמות
  if (anim) anim(now);
  else if (following) {
    const k = 1 - Math.exp(-dt * 4), tx = vw / 2 - following.x * cam.k, ty = vh / 2 - (following.y - 15) * cam.k;
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; applyCam();
  }
  requestAnimationFrame(tick);
}
function setRunning(on) {
  running = on;
  stage.classList.toggle('paused', !on);
  playBtn.textContent = on ? '❚❚' : '▶';
  playBtn.setAttribute('aria-label', on ? 'עצירה' : 'הפעלה');
  if (on) { last = performance.now(); requestAnimationFrame(tick); }
}
playBtn.onclick = () => setRunning(!running);

measure();
// מתחילים כשכל המפה על המסך
cam.k = fitK; cam.x = vw / 2 - W / 2 * cam.k; cam.y = vh / 2 - H / 2 * cam.k; clampCam(); commit(); applyCam();
// ציור פריים ראשון כדי שגם במצב "פחות תנועה" הדמויות יופיעו
{ running = true; tick(performance.now()); running = false; }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
setRunning(!reduce);
window.__village = { cam, walkers, followables, zoomAt, animateTo, startFollow, setRunning, fitK: () => fitK };
})();
</script>
