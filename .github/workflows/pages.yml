name: Publish demo to gh-pages

# GitHub Pages מוגש מהענף gh-pages. כל שינוי ב-demo/ מועתק לשם אוטומטית.
on:
  push:
    branches: [main, ccr-7419da80-z53gxw]
    paths: ['demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy demo/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r demo /tmp/site && touch /tmp/site/.nojekyll
          git fetch origin gh-pages
          git worktree add /tmp/ghp origin/gh-pages
          cd /tmp/ghp
          git rm -rq . && cp -r /tmp/site/. .
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Publish demo from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
