name: Build app and publish to gh-pages
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        working-directory: app
        run: npm ci && npm run build
      - name: Copy app/dist to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r app/dist /tmp/site && touch /tmp/site/.nojekyll
          git fetch origin gh-pages
          git worktree add /tmp/ghp origin/gh-pages
          cd /tmp/ghp
          git rm -rq . && cp -r /tmp/site/. .
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Publish app from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
