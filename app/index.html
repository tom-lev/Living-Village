<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Living Village</title>
<meta name="description" content="A hand-drawn vector map of a small village with living characters. Zoom in without losing sharpness.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="stage" role="img" aria-label="Illustrated village map">
  <canvas id="mapC"></canvas><svg id="mapS"></svg>
  <div id="dWrap"><svg id="mapD"></svg></div>
  <div id="grain" hidden></div>
</div>
<div id="instant" aria-hidden="true"></div>

<div class="controls">
  <button id="zfit" aria-label="Back to the full view">⤢</button>
  <button id="play" aria-label="Pause">❚❚</button>
  <button id="grid" aria-label="Block grid" aria-pressed="false">#</button>
  <button id="pal" aria-label="Colour palette" aria-haspopup="menu" aria-expanded="false">🎨</button>
</div>
<div class="zoom" id="zoomLbl">×1.0</div>
<div class="palMenu" id="palMenu" role="menu" aria-label="Colour palette" hidden></div>
<div class="follow" id="follow"><span id="followName"></span><button id="unfollow" aria-label="Stop following">✕</button></div>

<!-- תמונה מיידית (משימה 30): לפני שהקוד הראשי נטען, מציגים את המבט הראשון מהאריחים המוכנים מראש,
     בדיוק במקום שבו המפה החיה תצויר (אותו חישוב כמו המצלמה). כשהמפה החיה מוכנה התמונה יורדת. -->
<script>
(function () {
  try {
    var inl = window.__BAKED;   // בהעלאה הרשימה נכתבת לתוך הדף (בלי הורדה נוספת)
    // נתוני ההיגיון ורשת ההליכה: מתחילים לרדת רק אחרי שכל האריחים של התמונה הגיעו (או אחרי 1.5 שניות), כדי לא להתחרות בהם
    // ברשת של הטלפון – הבנייה ממילא מחכה לתמונה; רשת ההליכה נדרשת רק לדמויות, אז בעדיפות נמוכה
    var more = function () {
      if (!inl || window.__LOGIC) return;
      window.__LOGIC = fetch('tiles/logic.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      // (דחוסה; דפדפן בלי DecompressionStream – הקובץ הרגיל)
      var gz = typeof DecompressionStream !== 'undefined';
      window.__NAV = fetch(gz ? 'tiles/nav.navz' : 'tiles/nav.bin', { priority: 'low' }).then(function (r) { return !r.ok ? null : gz ? new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer() : r.arrayBuffer(); }).catch(function () { return null; });
    };
    (inl ? Promise.resolve(inl.manifest) : fetch('tiles/manifest.json').then(function (r) { return r.ok ? r.json() : null; })).then(function (m) {
      var box = document.getElementById('instant'); if (!m || !m.B || !box) return more();
      var pal = m.def; try { var s = localStorage.getItem('village-palette'); if (m.pals.indexOf(s) >= 0) pal = s; } catch (e) {}
      var pi = m.pals.indexOf(pal); if (pi < 0) return more();
      var vw = innerWidth, vh = innerHeight, B = { x0: m.B[0], y0: m.B[1], x1: m.B[2], y1: m.B[3] }, H = { x0: m.home[0], y0: m.home[1], x1: m.home[2], y1: m.home[3] };
      var hw = H.x1 - H.x0, hh = H.y1 - H.y0, c = Math.min(vw / hw, vh / hh), v = Math.max(vw / hw, vh / hh);
      var k = Math.max(v / c < 1.2 ? v : c, Math.max(vw / (B.x1 - B.x0), vh / (B.y1 - B.y0)));
      var cx = vw / 2 - (H.x0 + H.x1) / 2 * k, cy = vh / 2 - (H.y0 + H.y1) / 2 * k, BASE = 1 / 8, dpr = Math.min(devicePixelRatio || 1, 2);
      var l = Math.max(0, Math.min(m.maxL, Math.ceil(Math.log2(k * dpr / BASE) - .15))), tw = 256 / (BASE * Math.pow(2, l));
      var i0 = Math.max(0, Math.floor((-cx / k - B.x0) / tw)), i1 = Math.floor(((vw - cx) / k - B.x0) / tw);
      var j0 = Math.max(0, Math.floor((-cy / k - B.y0) / tw)), j1 = Math.floor(((vh - cy) / k - B.y0) / tw);
      for (var j = j0; j <= j1; j++) for (var i = i0; i <= i1; i++) {
        var im = new Image(), x = Math.round((B.x0 + i * tw) * k + cx), y = Math.round((B.y0 + j * tw) * k + cy);
        im.src = 'tiles/p' + pi + '/' + l + '/' + i + '_' + j + '.webp'; im.alt = '';
        im.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:' + (Math.round((B.x0 + (i + 1) * tw) * k + cx) - x) + 'px;height:' + (Math.round((B.y0 + (j + 1) * tw) * k + cy) - y) + 'px';
        box.appendChild(im);
      }
      // מתי התמונה המיידית הוצגה כולה (לתג של ?debug)
      var left = box.children.length;
      [].forEach.call(box.children, function (im) { im.onload = im.onerror = function () { if (--left === 0) { window.__instantAt = performance.now(); more(); } }; });
      if (!left) more(); else setTimeout(more, 1500);
    }).catch(more);
  } catch (e) {}
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
