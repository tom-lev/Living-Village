<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>כפר חי</title>
<meta name="description" content="מפה וקטורית מצוירת של כפר קטן עם דמויות חיות. אפשר להתקרב בלי לאבד חדות.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #7fb84d;
  --ink: #3b2f25;
  --ink-soft: #6b5a4a;
  --card: rgba(255, 252, 244, .94);
  --line: rgba(59, 47, 37, .14);
  --accent: #e2574c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #4d7a33; --card: rgba(40, 36, 30, .92); --ink: #f6eee2; --ink-soft: #cdbfae; --line: rgba(255, 255, 255, .14); }
}
:root[data-theme="dark"] { --bg: #4d7a33; --card: rgba(40, 36, 30, .92); --ink: #f6eee2; --ink-soft: #cdbfae; --line: rgba(255, 255, 255, .14); }

html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
/* שתי שכבות: סטטית (קרקע, דרכים, בתים, עצים) שמצוירת רק כשהמצלמה נעצרת,
   ודינמית (דמויות ואפקטים) שמתעדכנת בכל פריים. בזמן זום/גרירה השכבה הסטטית רק מוגדלת ב-GPU. */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#stage.drag { cursor: grabbing; }
#sWrap { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#mapS { position: absolute; display: block; }
#mapD { position: absolute; inset: 0; width: 100%; height: 100%; display: block; will-change: transform; }
svg { shape-rendering: geometricPrecision; }
svg text { font-family: "Rubik", system-ui, sans-serif; pointer-events: none; }
.who, .veh { cursor: pointer; }

/* כרטיס כותרת */
.card { position: fixed; top: max(12px, env(safe-area-inset-top)); inset-inline-start: 16px; max-width: min(340px, calc(100vw - 32px));
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px 12px;
  box-shadow: 0 6px 24px rgba(30, 50, 10, .18); backdrop-filter: blur(6px); }
.card h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: .2px; }
.card p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); }
.card .x { position: absolute; top: 6px; inset-inline-end: 6px; }
.card.min p { display: none; }
@media (max-width: 640px) { .card { padding: 10px 14px; } .card h1 { font-size: 18px; } .card p { font-size: 13px; } }

/* כפתורים */
.controls { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); inset-inline-end: 16px; display: flex; flex-direction: column; gap: 8px; }
button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  min-width: 44px; height: 44px; font-size: 20px; line-height: 1; cursor: pointer; box-shadow: 0 3px 12px rgba(30, 50, 10, .16);
  display: grid; place-items: center; padding: 0 10px; }
button:hover { filter: brightness(1.04); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card .x { min-width: 30px; height: 30px; font-size: 15px; box-shadow: none; border: 0; background: transparent; color: var(--ink-soft); }
.zoom { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); inset-inline-start: 16px; font-size: 13px; color: var(--ink-soft);
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.follow { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  display: none; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 6px 6px 14px; font-size: 14px; box-shadow: 0 3px 12px rgba(30, 50, 10, .16); white-space: nowrap; }
.follow.on { display: flex; }
.follow button { height: 30px; min-width: 30px; font-size: 14px; border-radius: 999px; box-shadow: none; }

/* אנימציות CSS לפרטים הקטנים (עצים, עשן, מים) */
.smoke { transform-box: fill-box; transform-origin: center; animation: smoke 4.8s linear infinite; opacity: 0; }
@keyframes smoke { 0% { transform: translate(0, 0) scale(.35); opacity: 0; } 12% { opacity: .8; } 100% { transform: translate(16px, -52px) scale(1.6); opacity: 0; } }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame .5s ease-in-out infinite alternate; }
@keyframes flame { from { transform: scale(.92, .9) skewX(-4deg); } to { transform: scale(1.06, 1.12) skewX(5deg); } }
.glow { animation: glow 1.6s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .35; } to { opacity: .6; } }
.ripple { transform-box: fill-box; transform-origin: center; animation: ripple 1.8s ease-out forwards; }
@keyframes ripple { from { transform: scale(.25); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
.glint { animation: glint 6s ease-in-out infinite; opacity: 0; }
@keyframes glint { 0%, 100% { opacity: 0; transform: translateX(0); } 50% { opacity: .9; transform: translateX(6px); } }
.drop { animation: drop 1.3s linear infinite; }
@keyframes drop {
  0% { transform: translate(0, 0); animation-timing-function: cubic-bezier(.3, .6, .6, 1); opacity: 1; }
  50% { transform: translate(var(--dx-half), -20px); animation-timing-function: cubic-bezier(.4, 0, .7, .4); }
  100% { transform: translate(var(--dx), 0); opacity: .2; } }
.pole { animation: pole 1.1s linear infinite; }
@keyframes pole { from { transform: translateY(0); } to { transform: translateY(-8px); } }
.tail { transform-box: fill-box; animation: tail 2.6s ease-in-out infinite; }
@keyframes tail { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
.peck { transform-box: fill-box; transform-origin: 80% 80%; animation: peck 1.4s ease-in-out infinite; }
@keyframes peck { 0%, 55%, 100% { transform: rotate(0); } 70% { transform: rotate(38deg); } 80% { transform: rotate(5deg); } 88% { transform: rotate(36deg); } }

#stage.paused * { animation-play-state: paused !important; }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="מפה מצוירת של כפר">
  <div id="sWrap"><svg id="mapS"></svg></div>
  <svg id="mapD"></svg>
</div>

<div class="card" id="card">
  <h1>כפר חי</h1>
  <p>מפה וקטורית: כל בית, עץ ודמות הם צורות בקוד ולא פיקסלים, אז בזום הכול נשאר חד.
     גלגלת או צביטה לזום, גרירה להזזה, ולחיצה על דמות או רכב כדי לעקוב אחריהם.</p>
  <button class="x" id="cardToggle" aria-label="הסתרת ההסבר">–</button>
</div>

<div class="controls">
  <button id="zin" aria-label="התקרבות">+</button>
  <button id="zout" aria-label="התרחקות">−</button>
  <button id="zfit" aria-label="חזרה לתצוגה המלאה">⤢</button>
  <button id="play" aria-label="עצירה">❚❚</button>
</div>
<div class="zoom" id="zoomLbl">×1.0</div>
<div class="follow" id="follow"><span id="followName"></span><button id="unfollow" aria-label="הפסקת מעקב">✕</button></div>

<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const W = 1600, H = 1000;                 // גודל המפה ביחידות עולם
const stage = document.getElementById('stage'), sWrap = document.getElementById('sWrap');
const svgS = document.getElementById('mapS'), svgD = document.getElementById('mapD');

/* ───────── כלי עזר ───────── */
function el(tag, a, parent) {
  const e = document.createElementNS(NS, tag);
  if (a) for (const k in a) e.setAttribute(k, a[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function mulberry(seed) {
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const R = mulberry(20261006);
const rand = (a, b) => a + (b - a) * R();
const pick = arr => arr[Math.floor(R() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const wrap1 = v => v - Math.floor(v);
const n2 = v => Math.round(v * 100) / 100;
const P = (p) => n2(p[0]) + ',' + n2(p[1]);
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, n >> 8 & 255, n & 255]
    .map(v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255));
  return '#' + ((1 << 24) | (c[0] << 16) | (c[1] << 8) | c[2]).toString(16).slice(1);
}
const circ = (cx, cy, r) => `M${n2(cx - r)},${n2(cy)}a${n2(r)},${n2(r)} 0 1,0 ${n2(2 * r)},0a${n2(r)},${n2(r)} 0 1,0 ${n2(-2 * r)},0`;
const rrect = (x, y, w, h, r) => `M${n2(x + r)},${n2(y)}h${n2(w - 2 * r)}a${r},${r} 0 0 1 ${r},${r}v${n2(h - 2 * r)}a${r},${r} 0 0 1 ${-r},${r}h${n2(-(w - 2 * r))}a${r},${r} 0 0 1 ${-r},${-r}v${n2(-(h - 2 * r))}a${r},${r} 0 0 1 ${r},${-r}Z`;
/* מסלול סגור וחלק דרך נקודות (Catmull-Rom → Bézier) */
function smoothClosed(pts) {
  const n = pts.length; let d = `M${P(pts[0])}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    d += `C${P([p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6])} ${P([p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6])} ${P(p2)}`;
  }
  return d + 'Z';
}
function blob(cx, cy, rx, ry, n, wob, seed) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, r = 1 + wob * Math.sin(3 * a + seed) + wob * .6 * Math.cos(5 * a + seed * 2);
    pts.push([cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r]);
  }
  return smoothClosed(pts);
}

/* ───────── שכבות ───────── */
const defs = el('defs', null, svgD);
const worldS = el('g', null, svgS), worldD = el('g', null, svgD);
const L = {};
for (const n of ['ground', 'roads', 'groundProps', 'water', 'props']) L[n] = el('g', { 'data-layer': n }, worldS);
for (const n of ['waterFx', 'cloudShadows', 'pad', 'fx', 'actors', 'air', 'clouds']) L[n] = el('g', { 'data-layer': n }, worldD);

/* ───────── רשת הדרכים: צמתים וקטעים (כל קטע הוא עקומת בזייה אחת) ───────── */
const NODES = {
  TL: [60, 120], C1: [430, 330], LE: [16, 560], C2: [470, 520], C3: [470, 790], BL: [70, 994],
  C4: [1000, 520], C5: [1000, 790], TC: [980, 6], L1: [1065, 400], L3: [1480, 380], L2: [1270, 640], R1: [1594, 860],
};
const BORDER = new Set(['LE', 'BL', 'TC', 'R1']);   // דרכים שיוצאות מהמפה: הולכים יוצאים ונכנסים שם
const EDGE_DEF = [
  ['TL', 'C1', 200, 160, 330, 240], ['C1', 'C2', 460, 400, 470, 450], ['C2', 'C4', 650, 500, 820, 500],
  ['TC', 'C4', 1000, 200, 960, 380], ['C4', 'L1', 1030, 480, 1050, 450], ['L1', 'L3', 1050, 70, 1480, 40],
  ['L3', 'L2', 1480, 560, 1400, 640], ['L2', 'L1', 1120, 650, 1060, 540], ['C5', 'L2', 1100, 760, 1220, 720],
  ['C2', 'C3', 480, 620, 460, 700], ['C4', 'C5', 990, 620, 1010, 700], ['C3', 'C5', 650, 810, 820, 810],
  ['C2', 'LE', 330, 540, 160, 580], ['C3', 'BL', 380, 870, 200, 940], ['C5', 'R1', 1200, 860, 1400, 880],
];
/* טבלת אורך-קשת לכל קטע, כדי להתקדם לפי מרחק אמיתי (ולא לפי t של העקומה) */
const EDGES = EDGE_DEF.map(([a, b, c1x, c1y, c2x, c2y]) => {
  const p0 = NODES[a], p3 = NODES[b], N = 200, pts = [], acc = [0];
  for (let i = 0; i <= N; i++) {
    const t = i / N, u = 1 - t;
    pts.push([u * u * u * p0[0] + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * p3[0],
              u * u * u * p0[1] + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * p3[1]]);
    if (i) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  }
  return { a, b, pts, acc, len: acc[N], d: `M${P(p0)}C${c1x},${c1y} ${c2x},${c2y} ${P(p3)}` };
});
function edgeAt(E, s) {
  s = clamp(s, 0, E.len);
  let lo = 0, hi = E.acc.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (E.acc[m] <= s) lo = m; else hi = m; }
  const f = (s - E.acc[lo]) / ((E.acc[hi] - E.acc[lo]) || 1), a = E.pts[lo], b = E.pts[hi];
  const dx = b[0] - a[0], dy = b[1] - a[1], dl = Math.hypot(dx, dy) || 1;
  return { x: a[0] + dx * f, y: a[1] + dy * f, tx: dx / dl, ty: dy / dl };
}
const ADJ = {};
EDGES.forEach((E, i) => {
  (ADJ[E.a] = ADJ[E.a] || []).push({ e: i, dir: 1 });
  (ADJ[E.b] = ADJ[E.b] || []).push({ e: i, dir: -1 });
});
const ROAD_SAMPLES = [];
EDGES.forEach(E => { for (let i = 0; i < E.pts.length; i += 5) ROAD_SAMPLES.push(E.pts[i]); });
function roadDist(x, y) {
  let m = 1e9;
  for (const p of ROAD_SAMPLES) { const d = (p[0] - x) ** 2 + (p[1] - y) ** 2; if (d < m) m = d; }
  return Math.sqrt(m);
}

/* ───────── אזורים שאסור לשתול בהם עצים ───────── */
const NO_TREE = [];
const block = (x0, y0, x1, y1) => NO_TREE.push([x0, y0, x1, y1]);
const LAKE = { cx: 1270, cy: 390, rx: 140, ry: 160 };
function treeOk(x, y) {
  if (x < 12 || x > W - 12 || y < 40 || y > H - 6) return false;
  for (const [x0, y0, x1, y1] of NO_TREE) if (x > x0 && x < x1 && y > y0 && y < y1) return false;
  if (((x - LAKE.cx) / (LAKE.rx + 40)) ** 2 + ((y - LAKE.cy) / (LAKE.ry + 34)) ** 2 < 1) return false;
  // גם הצמרת (שמעל נקודת הבסיס) לא מסתירה את הדרך
  return roadDist(x, y) > 36 && roadDist(x, y - 30) > 34;
}

/* ───────── עומק: אובייקטים נייחים ממוינים לפי y בשכבה הסטטית; הדמויות ממוינות ביניהן בשכבה הדינמית ───────── */
const statics = [];
function prop(y, parent) { const g = el('g', null, parent || L.props); if (!parent) statics.push({ el: g, y }); return g; }
const dynamics = [];
function sortDepth() {           // ממיין רק את הדמויות בשכבה הדינמית, ומזיז רק מה שלא במקום
  dynamics.sort((a, b) => a.y - b.y);
  let prev = null;
  for (const d of dynamics) {
    const want = prev ? prev.el.nextSibling : L.actors.firstChild;
    if (d.el !== want) L.actors.insertBefore(d.el, want);
    prev = d;
  }
}

/* ═════════════════════ ציור המפה ═════════════════════ */

/* קרקע */
el('rect', { x: 0, y: 0, width: W, height: H, fill: '#9cd162' }, L.ground);
for (let i = 0; i < 26; i++)
  el('path', { d: blob(rand(40, W - 40), rand(40, H - 40), rand(40, 110), rand(25, 60), 7, .12, rand(0, 6)), fill: '#a9d96f', opacity: .7 }, L.ground);
{
  let d = '';
  for (let i = 0; i < 520; i++) {
    const x = rand(14, W - 14), y = rand(14, H - 14);
    if (roadDist(x, y) < 32) continue;
    d += `M${n2(x - 3)},${n2(y)}l1.6,-4.2l1.4,4.2l1.4,-3.2l1.2,3.2`;
  }
  el('path', { d, fill: 'none', stroke: '#7fb84d', 'stroke-width': 1.1, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .8 }, L.ground);
}

/* דרכים: שוליים, משטח ופס בהיר באמצע */
{
  const all = EDGES.map(E => E.d).join('');
  el('path', { d: all, fill: 'none', stroke: '#e2b087', 'stroke-width': 58, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, L.roads);
  el('path', { d: all, fill: 'none', stroke: '#f6d4b2', 'stroke-width': 50, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, L.roads);
  el('path', { d: all, fill: 'none', stroke: '#fbe2c9', 'stroke-width': 16, 'stroke-linecap': 'round', opacity: .55 }, L.roads);
  let pebbles = '';
  for (let i = 0; i < 260; i++) {
    const E = pick(EDGES), p = edgeAt(E, rand(0, E.len)), o = rand(-20, 20);
    pebbles += circ(p.x - p.ty * o, p.y + p.tx * o, rand(.7, 1.5));
  }
  el('path', { d: pebbles, fill: '#e0b08a', opacity: .7 }, L.roads);
}

/* ───── עצים ───── */
function pine(x, y, s) {
  const g = prop(y), sw = el('g', null, g);
  el('ellipse', { cx: x + 2 * s, cy: y, rx: 9 * s, ry: 2.6 * s, fill: 'rgba(40,70,20,.22)' }, g);
  g.insertBefore(g.lastChild, sw);
  el('rect', { x: x - 1.4 * s, y: y - 6 * s, width: 2.8 * s, height: 6.5 * s, rx: .8 * s, fill: '#8b5a2b' }, sw);
  const tiers = [[5, 10.5, 14], [12, 8.5, 12], [18.5, 6.2, 10.5]];
  const c = pick(['#3f9150', '#3a8a4c', '#459a55']);
  for (const [dy, hw, th] of tiers) {
    const by = y - dy * s;
    el('path', { d: `M${n2(x - hw * s)},${n2(by)}L${n2(x)},${n2(by - th * s)}L${n2(x + hw * s)},${n2(by)}Z`, fill: c, 'stroke-linejoin': 'round', stroke: c, 'stroke-width': 1.5 }, sw);
    el('path', { d: `M${n2(x)},${n2(by - th * s)}L${n2(x + hw * s)},${n2(by)}L${n2(x + 1)},${n2(by)}Z`, fill: shade(c, .12) }, sw);
  }
}
function roundTree(x, y, s) {
  const g = prop(y), sw = el('g', null, g);
  el('ellipse', { cx: x + 2 * s, cy: y, rx: 10 * s, ry: 3 * s, fill: 'rgba(40,70,20,.22)' }, g);
  g.insertBefore(g.lastChild, sw);
  el('path', { d: `M${n2(x - 1.6 * s)},${n2(y)}L${n2(x - 1)},${n2(y - 14 * s)}L${n2(x + 1)},${n2(y - 14 * s)}L${n2(x + 1.6 * s)},${n2(y)}Z`, fill: '#8b5a2b' }, sw);
  const c = pick(['#5db85a', '#63bd5c', '#55ad55', '#7cc35a']);
  el('path', { d: circ(x, y - 22 * s, 10.5 * s) + circ(x - 6.5 * s, y - 16.5 * s, 7 * s) + circ(x + 6.5 * s, y - 17 * s, 7.5 * s), fill: c }, sw);
  el('path', { d: circ(x - 3 * s, y - 26 * s, 4.2 * s), fill: shade(c, .2) }, sw);
  let ticks = '';
  for (let i = 0; i < 3; i++) { const tx = x + rand(-6, 6) * s, ty = y - rand(14, 27) * s; ticks += `M${n2(tx)},${n2(ty)}q${n2(1.6 * s)},${n2(-1 * s)} ${n2(1.8 * s)},${n2(1 * s)}`; }
  el('path', { d: ticks, fill: 'none', stroke: shade(c, -.25), 'stroke-width': .9, 'stroke-linecap': 'round' }, sw);
  if (R() < .22) {
    let fr = '';
    for (let i = 0; i < 5; i++) fr += circ(x + rand(-9, 9) * s, y - rand(15, 28) * s, 1.3 * s);
    el('path', { d: fr, fill: '#e8513f' }, sw);
  }
}

/* ───── בתים ───── */
function chimneySmoke(x, y, scale) {

  if (chimney) el('rect', { x: x + w * .2, y: y - h - rh * .85, width: w * .11, height: rh * .55, fill: shade(roof, -.2), ...st }, g);
  el('rect', { x: x - w / 2, y: y - h, width: w, height: h, fill: wall, ...st }, g);
  el('rect', { x: x - w / 2, y: y - h, width: w * .14, height: h, fill: shade(wall, -.06) }, g);

  el('path', { d: `M${n2(x)},${n2(y - h - rh)}L${n2(x + w / 2 + 6)},${n2(y - h + 2)}L${n2(x + w * .1)},${n2(y - h + 2)}Z`, fill: shade(roof, .12) }, g);
  if (attic) {
    el('circle', { cx: x, cy: y - h - rh * .42, r: rh * .16, fill: '#fff7e0', ...st }, g);
    el('path', { d: `M${n2(x - rh * .16)},${n2(y - h - rh * .42)}h${n2(rh * .32)}M${n2(x)},${n2(y - h - rh * .58)}v${n2(rh * .32)}`, stroke: '#c9a47a', 'stroke-width': 1 }, g);
  }
  const dw = Math.min(14, w * .22), dh = Math.min(22, h * .6);
  el('path', { d: `M${n2(x - dw / 2)},${y}v${n2(-dh + dw / 2)}a${n2(dw / 2)},${n2(dw / 2)} 0 0 1 ${n2(dw)},0v${n2(dh - dw / 2)}Z`, fill: door, ...st }, g);
  el('circle', { cx: x + dw * .25, cy: y - dh * .45, r: 1, fill: '#f4d06f' }, g);
  const ww = Math.min(13, w * .2), wh = ww * .95;
  const wins = win === 2 ? [x - w * .3, x + w * .3] : win === 4 ? [x - w * .33, x - w * .19, x + w * .19, x + w * .33] : [x + w * .28];
  for (const wx of wins) {
    const wy = y - h * .62;
    el('rect', { x: wx - ww / 2, y: wy - wh / 2, width: ww, height: wh, rx: 1.2, fill: '#bfe6fb', stroke: '#fff', 'stroke-width': 1.6 }, g);
    el('path', { d: `M${n2(wx)},${n2(wy - wh / 2)}v${n2(wh)}M${n2(wx - ww / 2)},${n2(wy)}h${n2(ww)}`, stroke: '#fff', 'stroke-width': 1.1 }, g);
  }
  if (chimney) chimneySmoke(x + w * .255, y - h - rh * .9, Math.max(.7, w / 90));
  block(x - w / 2 - 14, y - h - rh - 10, x + w / 2 + 14, y + 16);
  return g;
}

/* פרופורציות (×גובה), כמו בסעיף 3 במדריך */
const PR = { thigh: .255, shin: .235, torso: .295, foot: .085, ua: .16, fa: .15, gap: .03, A: .13, lift: .075, KF: .6 };

function footPath(q, A, lift) {
  if (q < .5) return [A - 2 * A * (q / .5), 0, 0];

/* קינמטיקה הפוכה של שני מקטעים: sgn=1 ברך קדימה, sgn=-1 מרפק אחורה */

}

/* דמות: רשימת צורות SVG שמתעדכנות בכל פריים. הכול וקטורי, אז היא חדה גם בזום פי 20 */

/* ───── מניע על גרף הדרכים ───── */
class Rover {
  constructor(e, dir, s) { this.e = e; this.dir = dir; this.s = s; }
  get E() { return EDGES[this.e]; }
  endNode() { return this.dir > 0 ? this.E.b : this.E.a; }
  remaining() { return this.E.len - this.s; }
  at(lane) {
    const E = this.E, p = edgeAt(E, this.dir > 0 ? this.s : E.len - this.s), tx = p.tx * this.dir, ty = p.ty * this.dir;
    return [p.x - ty * lane, p.y + tx * lane];      // lane>0 = צד ימין של כיוון ההליכה
  }
  /* מתקדם; בסוף קטע בוחר המשך אקראי (בלי לחזור אחורה). מחזיר true בהגעה למבוי סתום */
  advance(ds, route) {
    this.s += ds;
    while (this.s >= this.E.len) {
      const over = this.s - this.E.len;
      let nx;
      if (route) { this.ri = (this.ri + 1) % route.length; nx = { e: route[this.ri][0], dir: route[this.ri][1] }; }
      else {
        const opts = ADJ[this.endNode()].filter(o => o.e !== this.e);
        if (!opts.length) { this.s = this.E.len; return true; }
        nx = pick(opts);
      }
      this.e = nx.e; this.dir = nx.dir; this.s = over;
    }
    return false;
  }
  turnAround() { this.dir = -this.dir; this.s = this.E.len - this.s; }
}

const followables = [];

function ripple(x, y, rx, ry, parent) {
  const e = el('ellipse', { cx: n2(x), cy: n2(y), rx, ry, fill: 'none', stroke: '#e8f8fd', 'stroke-width': 1.2, class: 'ripple' }, parent || waterFx);
  e.addEventListener('animationend', () => e.remove());
}
/* דג קופץ */
const fish = el('g', { display: 'none' }, L.waterFx);
{
  const f = el('g', { transform: 'scale(1.1)' }, fish);
  el('path', { d: 'M-8,0q8,-7 16,0q-8,7 -16,0z', fill: '#f2709c' }, f);
  el('path', { d: 'M-7,0l-5,-4v8z', fill: '#e2577f' }, f);
  el('circle', { cx: 4.5, cy: -1, r: .9, fill: '#222' }, f);
}
const FISH = { t: -1, wait: 3 };

/* פרפרים */
const BUTTERFLIES = ['#ff9f43', '#ffffff', '#6fb7ff', '#ff7aa2'].map((c, i) => {
  const g = el('g', null, L.air), wl = el('g', null, g), wr = el('g', null, g);
  el('ellipse', { cx: -2.6, cy: -1, rx: 2.8, ry: 2.2, fill: c, stroke: shade(c, -.3), 'stroke-width': .4 }, wl);
  el('ellipse', { cx: 2.6, cy: -1, rx: 2.8, ry: 2.2, fill: c, stroke: shade(c, -.3), 'stroke-width': .4 }, wr);
  el('rect', { x: -.5, y: -3, width: 1, height: 5, rx: .5, fill: '#3b2f25' }, g);
  return { g, wl, wr, cx: 640 + i * 70, cy: 915, s: rand(0, 100) };
});

/* עננים וצלליהם */
const CLOUDS = [[100, 140, 1.2], [700, 470, 1], [1150, 760, 1.3], [1500, 200, .9]].map(([x, y, s]) => {
  const d = circ(0, 0, 26 * s) + circ(-26 * s, 8 * s, 17 * s) + circ(26 * s, 7 * s, 19 * s) + circ(-8 * s, 14 * s, 18 * s) + circ(12 * s, 14 * s, 17 * s);
  const sh = el('path', { d, fill: '#2f5a1a', opacity: .08 }, L.cloudShadows);
  const c = el('g', null, L.clouds);
  el('path', { d, fill: '#ffffff', opacity: .92 }, c);
  el('path', { d: circ(-6 * s, -6 * s, 14 * s), fill: '#fff' }, c);
  return { sh, c, x, y, s, v: rand(5, 9) };
});
/* להקת ציפורים חוצה מדי פעם */
const FLOCK = { g: el('g', { display: 'none' }, L.clouds), birds: [], x: -100, y: 300, wait: 6 };
for (let i = 0; i < 4; i++) FLOCK.birds.push([el('path', { fill: 'none', stroke: '#3b2f25', 'stroke-width': 1.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, FLOCK.g), [[0, 0], [-14, -9], [-14, 9], [-28, -2]][i], rand(0, 6)]);

/* ───── הדמויות ───── */
const SKIN = ['#f1c7a5', '#e0ac85', '#c58c66', '#8d5a3b', '#f6d5bd'];
const LOOKS = [
  { name: 'נועה', h: 34, headR: .1, skin: SKIN[0], hair: '#6b3e26', hairStyle: 'long', shirt: '#e85d75', pants: '#3d5a80' },
  { name: 'איתי', h: 36, headR: .095, skin: SKIN[2], hair: '#2b2220', hairStyle: 'short', shirt: '#3aa0d8', pants: '#59463a', hold: 'leash' },
  { name: 'מאיה', h: 24, headR: .12, skin: SKIN[4], hair: '#b5651d', hairStyle: 'pony', shirt: '#ffcc33', pants: '#f1c7a5', skirt: '#ff7aa2', hold: 'balloon' },
  { name: 'סבתא רחל', h: 31, headR: .1, skin: SKIN[0], hair: '#e9e4dc', hairStyle: 'bun', shirt: '#8e6cc9', pants: '#f1c7a5', skirt: '#7656b3' },
  { name: 'דני', h: 35, headR: .095, skin: SKIN[1], hair: '#3b2a20', hairStyle: 'short', shirt: '#f28c28', pants: '#2f4858', hat: '#2e86de' },
  { name: 'ליה', h: 33, headR: .1, skin: SKIN[3], hair: '#1e1612', hairStyle: 'bun', shirt: '#fff7e6', pants: '#8d5a3b', skirt: '#2bb3a0' },
  { name: 'עומר', h: 33, headR: .1, skin: SKIN[1], hair: '#c0392b', hairStyle: 'short', shirt: '#6abf4b', pants: '#4a4a55' },
  { name: 'יעל', h: 32, headR: .1, skin: SKIN[2], hair: '#4a2c1a', hairStyle: 'pony', shirt: '#5b7bd5', pants: '#e9e4dc' },
  { name: 'אבי', h: 35, headR: .095, skin: SKIN[3], hair: '#1e1612', hairStyle: 'short', shirt: '#e2574c', pants: '#3b3b46' },
];
const SPEEDS = [26, 27, 21, 16, 28, 25, 30, 24, 26];
const walkers = LOOKS.map((l, i) => new Walker(l, SPEEDS[i]));
const dog = new Dog(walkers[1], '#c8894e');
const leash = new Leash(walkers[1], dog);
const balloon = new Balloon(walkers[2], '#e8413b');
// סבא על הספסל: מפזר פירורים ליונים מדי פעם
const grandpa = new Sitter({ name: 'סבא משה', h: 33, headR: .095, skin: SKIN[0], hair: '#d9d4cc', hairStyle: 'short', shirt: '#8a9a5b', pants: '#5a4a3a', hat: '#6b4a2f' },
  612, 744, .3 * 33, 1, (t, h) => {
    const toss = Math.max(0, Math.sin(t * .9)) ** 6;
    return [[.2 * h + toss * .12 * h, -.33 * h - toss * .1 * h], [.17 * h, -.32 * h]];
  });
// תמר ליד המדורה: מחממת ידיים
const camper = new Sitter({ name: 'תמר', h: 32, headR: .1, skin: SKIN[1], hair: '#2b2220', hairStyle: 'long', shirt: '#2bb3a0', pants: '#3d5a80' },
  FIRE[0] + 36, FIRE[1] + 1, .26 * 32, -1, (t, h) => {
    const w = Math.sin(t * 2.2) * .02 * h;
    return [[.32 * h + w, -.42 * h], [.3 * h - w, -.4 * h]];
  });
// רכבים: מכונית אדומה ומיניבוס צהוב שנוסעים בלולאה בכיוונים הפוכים
const ROUTE = [[2, 1], [4, 1], [5, 1], [6, 1], [8, -1], [11, -1], [9, -1]];
const ROUTE_REV = ROUTE.slice().reverse().map(([e, d]) => [e, -d]);
new Vehicle({ name: 'המכונית האדומה', color: '#ef5b5b', len: 52, speed: 48, lane: 9, route: ROUTE });
new Vehicle({ name: 'המיניבוס', color: '#ffc53d', len: 60, speed: 38, lane: 9, route: ROUTE_REV, tall: true, s: 40 });

statics.sort((a, b) => a.y - b.y);
for (const s of statics) L.props.appendChild(s.el);
sortDepth();

/* ═════════════════════ מצלמה: זום וגרירה ═════════════════════ */
const cam = { k: 1, x: 0, y: 0 };
let fitK = 1, vw = 0, vh = 0, anim = null, following = null;
const zoomLbl = document.getElementById('zoomLbl');
let committed = { k: 1, x: 0, y: 0 }, M = 0, commitTimer = 0;
function measure() {
  const r = stage.getBoundingClientRect(); vw = r.width; vh = r.height;
  fitK = Math.max(vw / W, vh / H);   // המפה תמיד ממלאת את כל המסך (גם בטלפון לאורך); את השאר רואים בגרירה
  // השכבה הסטטית גדולה מהמסך בשוליים M, כדי שבזמן גרירה/הקטנה לא ייחשפו חורים לפני הציור מחדש
  M = Math.round(Math.max(vw, vh) * .35);
  svgS.setAttribute('width', vw + 2 * M); svgS.setAttribute('height', vh + 2 * M);
  svgS.style.left = -M + 'px'; svgS.style.top = -M + 'px';
}
/* ציור חד של השכבה הסטטית במצב המצלמה הנוכחי (יקר; קורה רק כשהמצלמה נחה) */
function commit() {
  clearTimeout(commitTimer);
  committed = { k: cam.k, x: cam.x, y: cam.y };
  worldS.setAttribute('transform', `matrix(${cam.k} 0 0 ${cam.k} ${(cam.x + M).toFixed(2)} ${(cam.y + M).toFixed(2)})`);
  sWrap.style.transform = '';
}
function clampCam() {
  cam.k = clamp(cam.k, fitK, fitK * 24);
  cam.x = clamp(cam.x, vw - W * cam.k, 0);
  cam.y = clamp(cam.y, vh - H * cam.k, 0);
}
function applyCam() {
  clampCam();
  worldD.setAttribute('transform', `matrix(${cam.k} 0 0 ${cam.k} ${cam.x.toFixed(2)} ${cam.y.toFixed(2)})`);
  // השכבה הסטטית: רק transform של CSS (הגדלה ב-GPU, בלי לצייר מחדש)
  const s = cam.k / committed.k, tx = cam.x - s * committed.x, ty = cam.y - s * committed.y;
  const covered = tx - s * M <= 0 && ty - s * M <= 0 && tx + s * (vw + M) >= vw && ty + s * (vh + M) >= vh;
  if (!covered || s > 2.5) commit();
  else {
    sWrap.style.transform = `matrix(${s.toFixed(5)},0,0,${s.toFixed(5)},${tx.toFixed(2)},${ty.toFixed(2)})`;
    clearTimeout(commitTimer);
    if (Math.abs(s - 1) > 1e-4) commitTimer = setTimeout(commit, 160);   // הזזה בלבד לא מטשטשת, אין צורך לצייר מחדש
  }
  const z = cam.k / fitK;
  zoomLbl.textContent = '×' + z.toFixed(1);
  L.clouds.setAttribute('opacity', clamp((4 - z) / 2.5, 0, 1).toFixed(2));   // בזום עמוק העננים מתפוגגים
}
function zoomAt(sx, sy, f) {
  const nk = clamp(cam.k * f, fitK, fitK * 24), wx = (sx - cam.x) / cam.k, wy = (sy - cam.y) / cam.k;
  cam.k = nk; cam.x = sx - wx * nk; cam.y = sy - wy * nk; applyCam();
}
function animateTo(k, wx, wy, ms = 420) {        // wx,wy: נקודת עולם שתהיה במרכז המסך
  const s = { ...cam }, e = { k, x: vw / 2 - wx * k, y: vh / 2 - wy * k }, t0 = performance.now();
  anim = (now) => {
    const u = Math.min(1, (now - t0) / ms), q = u < .5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2;
    // אינטרפולציה לוגריתמית בזום כדי שהמעבר ירגיש אחיד
    cam.k = s.k * Math.pow(e.k / s.k, q);
    const cx = (vw / 2 - s.x) / s.k + ((vw / 2 - e.x) / e.k - (vw / 2 - s.x) / s.k) * q;
    const cy = (vh / 2 - s.y) / s.k + ((vh / 2 - e.y) / e.k - (vh / 2 - s.y) / s.k) * q;
    cam.x = vw / 2 - cx * cam.k; cam.y = vh / 2 - cy * cam.k; applyCam();
    if (u >= 1) anim = null;
  };
  if (!running) requestAnimationFrame(function step(n) { if (anim) { anim(n); requestAnimationFrame(step); } });
}
function center() { return [(vw / 2 - cam.x) / cam.k, (vh / 2 - cam.y) / cam.k]; }
function fitAll() { measure(); animateTo(fitK, 735, H / 2); }

stage.addEventListener('wheel', e => {
  e.preventDefault(); anim = null;
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? .012 : .0018)));
}, { passive: false });

const ptrs = new Map();
let down = null, pinch = null;
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) { const f = e.target.closest('[data-f]'); down = { x: e.clientX, y: e.clientY, f: f ? +f.dataset.f : null, moved: false }; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), c: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] }; if (down) down.moved = true; }
  anim = null; stage.classList.add('drag');
  if (innerWidth < 640 && !card.classList.contains('min')) document.getElementById('cardToggle').click();
});
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const r = stage.getBoundingClientRect();
  if (ptrs.size === 1) {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down.moved = true; }
    if (down && down.moved) { cam.x += e.clientX - prev[0]; cam.y += e.clientY - prev[1]; if (following) stopFollow(); applyCam(); }
  } else if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    cam.x += c[0] - pinch.c[0]; cam.y += c[1] - pinch.c[1];
    zoomAt(c[0] - r.left, c[1] - r.top, d / pinch.d);
    pinch = { d, c };
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) {
    stage.classList.remove('drag');
    if (down && !down.moved && down.f !== null) startFollow(followables[down.f]);
    down = null;
  }
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('dblclick', e => { const r = stage.getBoundingClientRect(); const wx = (e.clientX - r.left - cam.x) / cam.k, wy = (e.clientY - r.top - cam.y) / cam.k; animateTo(Math.min(cam.k * 2, fitK * 24), wx, wy); });

const followEl = document.getElementById('follow');
function startFollow(f) {
  following = f;
  document.getElementById('followName').textContent = 'עוקבים אחרי ' + f.name;
  followEl.classList.add('on');
  if (cam.k < fitK * 4) animateTo(fitK * 5, f.x, f.y - 15, 650);
}
function stopFollow() { following = null; followEl.classList.remove('on'); }
document.getElementById('unfollow').onclick = stopFollow;
document.getElementById('zin').onclick = () => { const c = center(); animateTo(Math.min(cam.k * 1.8, fitK * 24), c[0], c[1], 300); };
document.getElementById('zout').onclick = () => { const c = center(); animateTo(Math.max(cam.k / 1.8, fitK), c[0], c[1], 300); };
document.getElementById('zfit').onclick = () => { stopFollow(); fitAll(); };
const card = document.getElementById('card');
document.getElementById('cardToggle').onclick = e => { card.classList.toggle('min'); e.currentTarget.textContent = card.classList.contains('min') ? '?' : '–'; };
addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=') document.getElementById('zin').click();
  if (e.key === '-') document.getElementById('zout').click();
  if (e.key === '0') document.getElementById('zfit').click();
});
addEventListener('resize', () => { const c = center(), z = cam.k / fitK; measure(); cam.k = fitK * z; cam.x = vw / 2 - c[0] * cam.k; cam.y = vh / 2 - c[1] * cam.k; clampCam(); commit(); applyCam(); });

/* ═════════════════════ לולאת האנימציה ═════════════════════ */
let running = false, last = 0, T = 0, frame = 0;
const playBtn = document.getElementById('play');
function tick(now) {
  if (!running) return;
  const dt = Math.min(.05, (now - last) / 1000 || .016); last = now; T += dt; frame++;
  for (const w of walkers) w.update(dt, T);
  dog.update(dt, T); leash.update(); balloon.update(dt, T);
  grandpa.update(dt, T); camper.update(dt, T);
  for (const d of dynamics) if (d instanceof Vehicle) d.update(dt);
  if (frame % 6 === 0) sortDepth();
  // סוסים: רועים ומרימים ראש מדי פעם
  for (const h of HORSES) {
    h.timer -= dt;
    if (h.timer <= 0) { h.graze = !h.graze; h.timer = h.graze ? rand(5, 11) : rand(2, 4); }
    h.ta = h.graze ? 75 : 0; h.a += (h.ta - h.a) * Math.min(1, dt * 2.2);
    h.neck.setAttribute('transform', `translate(18,${(-42 + h.a / 75 * 16).toFixed(1)}) rotate(${h.a.toFixed(1)})`);
  }
  for (const s of SHEEP) s.update(dt);
  if (frame % 8 === 0) { const ord = SHEEP.slice().sort((a, b) => a.y - b.y); for (const s of ord) L.pad.appendChild(s.g); }
  // ברווזים: האמא מובילה, הקטנים בעקבותיה
  DUCKS.forEach((d, i) => {
    const th = T * .07 - i * .085 - (i ? .05 : 0), p = duckPath(th), q = duckPath(th + .01), f = q[0] >= p[0] ? 1 : -1;
    d.flip += (f - d.flip) * Math.min(1, dt * 4);
    d.g.setAttribute('transform', `translate(${n2(p[0])},${n2(p[1] + Math.sin(T * 3 + i) * .6)}) scale(${d.flip.toFixed(3)},1)`);
    if (i === 0 && frame % 50 === 0) ripple(p[0] - f * 8, p[1], 9, 3);
  });
  // דג
  if (FISH.t < 0) {
    FISH.wait -= dt;
    if (FISH.wait <= 0) {
      const a = rand(0, 6.28), r = rand(.2, .6), x = LAKE.cx + Math.cos(a) * LAKE.rx * r, y = LAKE.cy + Math.sin(a) * LAKE.ry * r;
      Object.assign(FISH, { t: 0, x, y, dx: pick([-1, 1]) * rand(30, 44) }); fish.setAttribute('display', 'inline'); ripple(x, y, 9, 3.5);
    }
  } else {
    FISH.t += dt / 1.1;
    const u = Math.min(1, FISH.t), x = FISH.x + FISH.dx * u, y = FISH.y - 34 * 4 * u * (1 - u), vy = -34 * 4 * (1 - 2 * u);
    fish.setAttribute('transform', `translate(${n2(x)},${n2(y)}) scale(${FISH.dx > 0 ? 1 : -1},1) rotate(${(Math.atan2(vy, Math.abs(FISH.dx)) * 180 / Math.PI).toFixed(1)})`);
    if (u >= 1) { FISH.t = -1; FISH.wait = rand(5, 10); fish.setAttribute('display', 'none'); ripple(x, FISH.y, 10, 3.5); ripple(x, FISH.y, 5, 2); }
  }
  // פרפרים
  for (const b of BUTTERFLIES) {
    const s = b.s + T, x = b.cx + Math.sin(s * .37) * 90 + Math.sin(s * 1.3) * 18, y = b.cy + Math.sin(s * .53) * 32 + Math.cos(s * 1.7) * 8 - 10;
    const flap = Math.abs(Math.sin(s * 15)) * .8 + .2;
    b.g.setAttribute('transform', `translate(${n2(x)},${n2(y)})`);
    b.wl.setAttribute('transform', `translate(0,0) scale(${flap.toFixed(2)},1)`); b.wr.setAttribute('transform', `scale(${flap.toFixed(2)},1)`);
  }
  // עננים
  for (const c of CLOUDS) {
    c.x += c.v * dt; if (c.x > W + 160) c.x = -160;
    c.c.setAttribute('transform', `translate(${n2(c.x)},${n2(c.y)})`);
    c.sh.setAttribute('transform', `translate(${n2(c.x + 40)},${n2(c.y + 110)})`);
  }
  // להקת ציפורים
  if (FLOCK.x > W + 80 || FLOCK.g.getAttribute('display') === 'none') {
    FLOCK.wait -= dt;
    if (FLOCK.wait <= 0) { FLOCK.x = -60; FLOCK.y = rand(150, 800); FLOCK.wait = rand(18, 30); FLOCK.g.setAttribute('display', 'inline'); }
    else if (FLOCK.x > W + 80) FLOCK.g.setAttribute('display', 'none');
  }
  if (FLOCK.g.getAttribute('display') !== 'none') {
    FLOCK.x += 60 * dt; FLOCK.y -= 6 * dt;
    for (const [p, [ox, oy], ph] of FLOCK.birds) {
      const f = Math.sin(T * 9 + ph) * 4, x = FLOCK.x + ox, y = FLOCK.y + oy + Math.sin(T * 1.5 + ph) * 2;
      p.setAttribute('d', `M${n2(x - 6)},${n2(y + f * .3)}Q${n2(x - 3)},${n2(y - f)} ${n2(x)},${n2(y)}Q${n2(x + 3)},${n2(y - f)} ${n2(x + 6)},${n2(y + f * .3)}`);
    }
  }
  // מצלמה: אנימציית זום, או מעקב חלק אחרי דמות
  if (anim) anim(now);
  else if (following) {
    const k = 1 - Math.exp(-dt * 4), tx = vw / 2 - following.x * cam.k, ty = vh / 2 - (following.y - 15) * cam.k;
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; applyCam();
  }
  requestAnimationFrame(tick);
}
function setRunning(on) {
  running = on;
  stage.classList.toggle('paused', !on);
  playBtn.textContent = on ? '❚❚' : '▶';
  playBtn.setAttribute('aria-label', on ? 'עצירה' : 'הפעלה');
  if (on) { last = performance.now(); requestAnimationFrame(tick); }
}
playBtn.onclick = () => setRunning(!running);

measure();
// מתחילים כשהמפה ממלאת את המסך, ממורכזת על כיכר הכפר
cam.k = fitK; cam.x = vw / 2 - 735 * cam.k; cam.y = vh / 2 - H / 2 * cam.k; clampCam(); commit(); applyCam();
// ציור פריים ראשון כדי שגם במצב "פחות תנועה" הדמויות יופיעו
{ running = true; tick(performance.now()); running = false; }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
setRunning(!reduce);
window.__village = { cam, walkers, followables, zoomAt, animateTo, startFollow, setRunning, fitK: () => fitK };
})();
</script>
