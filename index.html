<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Living Village</title>
<meta name="description" content="A hand-drawn vector map of a small village with living characters. Zoom in without losing sharpness.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

<body>
<div id="stage" role="img" aria-label="Illustrated village map">
  <canvas id="mapC"></canvas><svg id="mapS"></svg>
  <div id="dWrap"><svg id="mapD"></svg></div>
  <div id="grain" hidden></div>
</div>

<div class="controls">
  <button id="zfit" aria-label="Back to the full view">⤢</button>
  <button id="play" aria-label="Pause">❚❚</button>

  <button id="pal" aria-label="Colour palette" aria-haspopup="menu" aria-expanded="false">🎨</button>
</div>
<div class="zoom" id="zoomLbl">×1.0</div>
<div class="palMenu" id="palMenu" role="menu" aria-label="Colour palette" hidden></div>
<div class="follow" id="follow"><span id="followName"></span><button id="unfollow" aria-label="Stop following">✕</button></div>
